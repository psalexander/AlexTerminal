<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3040"/>
      <stop offset="1" stop-color="#1A1D24"/>
    </linearGradient>
    <clipPath id="rounded"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
  </defs>
  <!-- macOS-style rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="70" y="70" width="884" height="884" rx="194" fill="none" stroke="#2E3440" stroke-width="10"/>

  <!-- sidebar strip -->
  <g clip-path="url(#rounded)">
    <rect x="64" y="64" width="190" height="896" fill="#191C23"/>
    <rect x="254" y="64" width="10" height="896" fill="#2E3440"/>
  </g>
  <!-- tab marks -->
  <rect x="128" y="372" width="60" height="22" rx="11" fill="#5A6271"/>
  <rect x="128" y="448" width="86" height="22" rx="11" fill="#7FB3C8"/>
  <rect x="128" y="524" width="60" height="22" rx="11" fill="#5A6271"/>
  <!-- nested tab indent -->
  <rect x="152" y="600" width="44" height="22" rx="11" fill="#5A6271"/>

  <!-- prompt chevron -->
  <path d="M400 320 L640 500 L400 680" fill="none" stroke="#CDD3DE" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- block cursor -->
  <rect x="610" y="610" width="150" height="90" rx="14" fill="#E0B46B"/>
</svg>
