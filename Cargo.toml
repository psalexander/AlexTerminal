[workspace]
resolver = "3"
members = ["crates/at-core", "crates/at-proto", "crates/at-term", "crates/at-daemon", "crates/at-client", "crates/at-app"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["AlexTerminal contributors"]
rust-version = "1.85"

[workspace.dependencies]
at-core = { path = "crates/at-core" }
at-proto = { path = "crates/at-proto" }
at-term = { path = "crates/at-term" }
at-daemon = { path = "crates/at-daemon" }
at-client = { path = "crates/at-client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rmp-serde = "1.3"
ulid = { version = "1", features = ["serde"] }
dirs = "6"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
base64 = "0.22"
regex = "1"
alacritty_terminal = "0.26"
portable-pty = "0.9"
iced = { version = "0.14", features = ["canvas", "advanced", "tokio", "image"] }
fluent-templates = "0.15"
sys-locale = "0.3"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
